plugins {
    id 'com.android.application'
}

android {
    namespace 'id.sch.smpn45sby.ilok'
    compileSdk 34

    defaultConfig {
        applicationId "id.sch.smpn45sby.ilok"
        minSdk 21          // Android 5.0 Lollipop ke atas
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// Tanpa dependensi tambahan (tanpa AndroidX) supaya APK sangat ringan.
dependencies {
}
