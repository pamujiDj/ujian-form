name: Build ILOK APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      # Mencari folder proyek Android (yang punya settings.gradle dan app/build.gradle).
      # Jika tidak ada, tetapi ada file .zip (mis. ILOK.zip) di repository, zip itu diekstrak otomatis.
      - name: Cari folder proyek
        id: find
        run: |
          find_proj() {
            for s in $(find . -maxdepth 4 -name settings.gradle -not -path './.git/*'); do
              d=$(dirname "$s")
              if [ -f "$d/app/build.gradle" ]; then echo "$d"; return; fi
            done
          }
          DIR=$(find_proj)
          if [ -z "$DIR" ]; then
            ZIP=$(find . -maxdepth 2 -iname '*.zip' -not -path './.git/*' | head -n 1)
            if [ -n "$ZIP" ]; then
              echo "Mengekstrak $ZIP ..."
              unzip -q -o "$ZIP" -d _src
              DIR=$(find_proj)
            fi
          fi
          if [ -z "$DIR" ]; then
            echo "::error::Folder proyek tidak lengkap: app/build.gradle tidak ditemukan. Upload folder 'app' atau file ILOK.zip ke repository."
            echo "Isi repository saat ini:"
            find . -not -path './.git/*' | head -80
            exit 1
          fi
          echo "Folder proyek: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Pasang Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Android SDK sudah tersedia di ubuntu-latest, cukup terima lisensinya
      - name: Terima lisensi Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Pasang Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK (debug, siap dipasang)
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Ganti nama APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: cp app/build/outputs/apk/debug/app-debug.apk ILOK.apk

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: ILOK-APK
          path: ${{ steps.find.outputs.dir }}/ILOK.apk
